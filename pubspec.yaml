name: vividfit_v2
description: "VividFit - Fitness App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # 状态管理
  flutter_riverpod: ^2.6.1

  # 路由
  go_router: ^14.6.0

  # 网络
  dio: ^5.7.0

  # 本地存储
  shared_preferences: ^2.3.3

  # UI 工具(保留旧项目依赖)
  flutter_screenutil: ^5.9.3
  video_player: ^2.9.2
  fluttertoast: ^8.2.10
  pinput: ^5.0.0
  intl_phone_field: ^3.2.0

  # 系统
  connectivity_plus: ^6.1.0
  url_launcher: ^6.3.1
  wakelock_plus: ^1.2.8

  # 数据模型
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # 国际化
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # 代码生成
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0

  # 测试
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/lidong.mp4
    - images/
    - images/newUIScreen/
    - images/newUIScreen/icons/
    - images/newUIScreen/device_icons/
    - images/newUIScreen/courseTopDataIcon/
    - images/newUIScreen/courseImage/
    - images/newUIScreen/HomePageAnimation/other/
    - images/newUIScreen/bigScreenAnimation/icons/
    - images/newUIScreen/bigScreenAnimation/bigDeviceFirstPage/

  fonts:
    - family: BEBAS
      fonts:
        - asset: fonts/BEBAS-1.ttf
    - family: hofontmedium
      fonts:
        - asset: fonts/HARMONYOS_SANS_SC_MEDIUM.ttf
    - family: hofontregular
      fonts:
        - asset: fonts/HARMONYOS_SANS_SC_REGULAR.ttf
    - family: hofontblod
      fonts:
        - asset: fonts/HARMONYOS_SANS_SC_REGULAR.ttf
    - family: hofontrelight
      fonts:
        - asset: fonts/HARMONYOS_SANS_SC_REGULAR.ttf
