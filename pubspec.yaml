name: vividfit_v2
description: "VividFit - Fitness App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.9

  # 状态管理
  flutter_riverpod: ^3.4.1
  riverpod_annotation: ^4.0.5

  # 路由
  go_router: ^17.3.0

  # 网络
  dio: ^5.11.0

  # 本地存储
  shared_preferences: ^2.5.5

  # UI 工具
  flutter_screenutil: ^5.9.3
  video_player: ^2.13.0
  fluttertoast: ^9.1.0
  pinput: ^6.0.2
  intl_phone_field: ^3.2.0

  # 主页模块
  step_progress_indicator: ^1.0.2
  extended_image: ^10.1.0
  device_info_plus: ^13.2.0
  permission_handler: ^12.0.3

  # 课程模块
  loading_animation_widget: ^1.2.1
  percent_indicator: ^4.2.3
  cached_network_image: ^3.4.1

  # 系统
  connectivity_plus: ^7.3.1
  url_launcher: ^6.3.1
  wakelock_plus: ^1.7.0

  # 蓝牙
  flutter_blue_plus: ^2.3.11

  # 数据模型
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # 国际化
  intl: ^0.20.2

  # 快速开始页
  just_audio: ^0.9.39
  fl_chart: ^0.69.0

  # WebView
  flutter_inappwebview: ^6.1.0

  # ZIP 解压
  archive: ^3.4.1

  # 文件路径
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # 代码生成
  build_runner: ^2.15.1
  freezed: ^4.0.0-dev.3
  json_serializable: ^6.14.0
  riverpod_generator: ^4.0.4

  # 测试
  mocktail: ^1.0.4

dependency_overrides:
  meta: ^1.19.0
  test_api: ^0.7.13
  test_core: ^0.6.19
  matcher: ^0.12.20
  dart_style: ^3.1.9

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/lidong.mp4
    - images/
    - images/newUIScreen/
    - images/newUIScreen/icons/
    - images/newUIScreen/defaultheadimages/
    - images/newUIScreen/HomePageAnimation/
    - images/sportSettingPIC/
    - images/sportSettingPIC/cn/
    - images/sportSettingPIC/en/
    - images/sportSettingPIC/de/
    - images/sportSettingPIC/jp/
    - images/sportSettingPIC/hant/
    - images/newUIScreen/device_icons/
    - images/newUIScreen/courseTopDataIcon/
    - images/newUIScreen/courseImage/
    - images/newUIScreen/HomePageAnimation/other/
    - images/newUIScreen/HomePageAnimation/search_animation/
    - images/newUIScreen/HomePageAnimation/xinxin/
    - images/newUIScreen/HomePageAnimation/rubby/
    - images/newUIScreen/HomePageAnimation/cat/
    - images/newUIScreen/HomePageAnimation/boxing/
    - images/newUIScreen/HomePageAnimation/dog/
    - images/newUIScreen/HomePageAnimation/jack/
    - images/newUIScreen/HomePageAnimation/carol/
    - images/newUIScreen/bigScreenAnimation/bigDeviceMusicPlay/
    - images/newUIScreen/bigScreenAnimation/icons/
    - images/newUIScreen/bigScreenAnimation/bigDeviceFirstPage/
    - images/newUIScreen/bigScreenAnimation/bigDevicePlayCourseIcon/

  fonts:
    - family: BEBAS
      fonts:
        - asset: fonts/BEBAS-1.ttf
    - family: hofontmedium
      fonts:
        - asset: fonts/HARMONYOS_SANS_SC_MEDIUM.ttf
    - family: hofontregular
      fonts:
        - asset: fonts/HARMONYOS_SANS_SC_REGULAR.ttf
    - family: hofontblod
      fonts:
        - asset: fonts/HARMONYOS_SANS_SC_REGULAR.ttf
    - family: hofontrelight
      fonts:
        - asset: fonts/HARMONYOS_SANS_SC_REGULAR.ttf
